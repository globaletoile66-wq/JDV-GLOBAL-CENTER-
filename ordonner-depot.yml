name: Ordonner le dépôt (livraison Rocket)
on:
  push:
    branches: [livraison]
permissions:
  contents: write
jobs:
  ordonner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: livraison, path: liv }
      - uses: actions/checkout@v4
        with: { ref: supabase-sync-2026-09-24, path: repo, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Rangement et fusion
        run: |
          set -e
          ZIP=$(find liv -name 'jdv-livraison-depot.zip' | head -1)
          [ -n "$ZIP" ] || { echo "zip introuvable"; exit 1; }
          unzip -q "$ZIP" -d work
          cd repo
          git config user.name "jdv-bot"; git config user.email "jdv-bot@users.noreply.github.com"
          bash ../work/livraison/ordonner-depot.sh 2>&1 | tee ../rangement.log
          git push origin integration/rocket-fusion-2026-10-15
      - name: Build (informatif)
        continue-on-error: true
        working-directory: repo
        run: |
          npm install --no-audit --no-fund > ../npm.log 2>&1
          npx tsc --noEmit > ../tsc.log 2>&1 || true
          npx next build > ../build.log 2>&1 || true
      - name: Résumé
        if: always()
        run: |
          { echo "## Rangement"; echo '```'; tail -20 rangement.log; echo '```';
            echo "## Erreurs TypeScript : $(grep -c 'error TS' tsc.log 2>/dev/null || echo '?')"; echo '```'; head -25 tsc.log 2>/dev/null; echo '```';
            echo "## Build"; echo '```'; tail -15 build.log 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
