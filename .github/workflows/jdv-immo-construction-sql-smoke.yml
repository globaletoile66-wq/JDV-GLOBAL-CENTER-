name: JDV Immo construction schema smoke test
# Re-run after aligning all migration filenames with the active Supabase history

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/jdv_*"
      - ".github/workflows/jdv-immo-construction-sql-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  immo-construction-postgres-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jdv_immo_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jdv_immo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: jdv_immo_test
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disposable auth fixture
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/jdv_immo_construction_fixture.sql
      - name: Apply the exact versioned migrations
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261020084707_jdv_immo_construction_editor.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261020085706_jdv_immo_construction_assignee_index.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261020090809_jdv_global_user_and_organization_foreign_keys.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261020091544_jdv_services_marketplace_v1.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261020092130_jdv_services_workflow_hardening_v1.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261020092622_jdv_cross_module_relationships_v1.sql
      - name: Assert schema, grants and RLS
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/jdv_immo_construction_assertions.sql
      - name: Assert cross-module foreign keys and preserve legacy CRM code
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/jdv_global_relationships_assertions.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/jdv_cross_module_relationships_assertions.sql
      - name: Assert JDV Services schema, grants and workflow triggers
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/jdv_services_assertions.sql
      - name: Exercise JDV Services participant workflow
        run: bash supabase/tests/jdv_services_rls_behavior.sh
      - name: Exercise owner isolation
        run: bash supabase/tests/jdv_immo_construction_rls_behavior.sh
