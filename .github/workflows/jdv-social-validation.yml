name: JDV Social Web and Mobile validation

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - feat/jdv-social-foundation-2026-10-19
    paths:
      - 'src/app/social/**'
      - 'mobile/**'
      - 'supabase/migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/jdv-social-validation.yml'
  pull_request:
    paths:
      - 'src/app/social/**'
      - 'mobile/**'
      - 'supabase/migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/jdv-social-validation.yml'

jobs:
  web-typecheck:
    name: Web — TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Web dependencies
        run: npm ci
      - name: Check Web types
        run: npm run type-check
      - name: Build Web application
        env:
          # Public client config is optional for CI compilation. Prefer repository
          # secrets when configured; otherwise use non-secret placeholders so
          # prerendering can construct the Supabase client without credentials.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key-for-ci-build' }}
        run: npm run build

  mobile-typecheck:
    name: Mobile — TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: .
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Mobile dependencies
        run: npm install --no-audit --no-fund
      - name: Check Mobile types
        run: npm run type-check
